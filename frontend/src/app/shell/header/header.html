<ng-container *transloco="let t">
  <p-menubar [model]="menuItems()">
    <ng-template #start>
      <a class="brand" href="/" (click)="$event.preventDefault(); goHome()">
        <i class="pi pi-arrow-right-arrow-left" aria-hidden="true"></i>
        <span>{{ t('app.title') }}</span>
      </a>
    </ng-template>

    <ng-template #end>
      <div class="controls">
        <p-select
          [options]="languageOptions"
          optionLabel="label"
          optionValue="value"
          [ngModel]="languages.language()"
          (ngModelChange)="setLanguage($event)"
          [ariaLabel]="t('header.language')"
          size="small"
        />

        <label class="acting-as" for="acting-as">{{ t('header.actingAs') }}</label>
        <p-select
          inputId="acting-as"
          [options]="personaGroups()"
          [group]="true"
          optionLabel="label"
          optionValue="value"
          [ngModel]="personas.key()"
          (ngModelChange)="actAs($event)"
          [filter]="true"
          filterBy="label"
          [placeholder]="t('header.actingAs')"
          appendTo="body"
          styleClass="persona-select"
          size="small"
        >
          <ng-template #selectedItem>{{ actingAsLabel() }}</ng-template>
          <ng-template #group let-group>
            <span class="group-label">{{ group.label }}</span>
          </ng-template>
        </p-select>
      </div>
    </ng-template>
  </p-menubar>
</ng-container>
