services:
  postgres:
    image: postgres:17-alpine
    container_name: equadis-postgres
    environment:
      POSTGRES_DB: equadis_portal
      POSTGRES_USER: portal
      POSTGRES_PASSWORD: portal
      TZ: Europe/Paris
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U portal -d equadis_portal"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  postgres-data:
